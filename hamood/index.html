<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لحمود</title>
<meta name="description" content="رسالة صغيرة لحمود">
<meta property="og:title" content="لحمود">
<meta property="og:description" content="افتحها">
<meta name="theme-color" content="#2a0a1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z' fill='%23ff3d77'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
/* One full-screen scene. Dawn gradient for "good morning", which melts into a deep rose night for "I love you forever". Canvas hearts float behind; tapping anywhere bursts more. Deliberately single-theme. */
:root{
  color-scheme:dark;
  --dawn1:#ffd7b0; --dawn2:#ff9fb3; --dawn3:#c86b9e;
  --night1:#2a0a1e; --night2:#5a1238; --night3:#a3245a;
  --rose:#ff3d77; --blush:#ffc2d6; --gold:#ffd88a; --ink:#3a0b25; --white:#fff6f9;
  --font-script:"Aref Ruqaa","Amiri","Times New Roman",serif;
  --font-ui:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{direction:rtl; background:var(--night1); color:var(--white); font-family:var(--font-ui); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
.sky{position:fixed; inset:0; transition:opacity 2.2s ease}
.sky.dawn{background:radial-gradient(120% 80% at 50% 105%, var(--dawn1) 0%, var(--dawn2) 45%, var(--dawn3) 100%)}
.sky.night{background:radial-gradient(120% 90% at 50% 40%, var(--night3) 0%, var(--night2) 40%, var(--night1) 100%); opacity:0}
body.love .sky.night{opacity:1}
.sun{position:fixed; left:50%; bottom:-18vmin; width:46vmin; height:46vmin; margin-left:-23vmin; border-radius:50%; background:radial-gradient(circle, #fff3d6 0%, var(--gold) 45%, rgba(255,216,138,0) 70%); transition:transform 3.5s cubic-bezier(.2,.8,.2,1), opacity 2s ease; transform:translateY(20vmin); opacity:.95}
body.morning .sun{transform:translateY(-14vmin)}
body.love .sun{opacity:0; transform:translateY(10vmin)}
canvas{position:fixed; inset:0; width:100%; height:100%; display:block}
.stage{position:fixed; inset:0; display:grid; place-items:center; padding:calc(24px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); text-align:center; pointer-events:none}
.line{grid-area:1/1; font-family:var(--font-script); font-weight:700; line-height:1.4; margin:0; max-width:14ch}
#morning{font-size:clamp(2.6rem, 13vw, 5.6rem); color:var(--ink); text-shadow:0 2px 18px rgba(255,255,255,.55); transition:opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease}
#morning.gone{opacity:0; transform:translateY(-18px) scale(.96); filter:blur(6px)}
#morning .caret{display:inline-block; width:.06em; height:.9em; background:currentColor; margin-inline-start:.08em; vertical-align:-.08em; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#forever{font-size:clamp(3.4rem, 18vw, 7.6rem); color:var(--white); opacity:0; transform:scale(.6); text-shadow:0 0 22px rgba(255,61,119,.85), 0 0 60px rgba(255,61,119,.55)}
body.love #forever{animation:pop 1.4s cubic-bezier(.2,1.5,.35,1) .2s forwards, beat 1.6s ease-in-out 1.8s infinite}
@keyframes pop{0%{opacity:0; transform:scale(.6)} 100%{opacity:1; transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)} 15%{transform:scale(1.07)} 30%{transform:scale(1)} 45%{transform:scale(1.05)}}
.name{display:block; font-size:.42em; color:var(--blush); margin-top:.2em; opacity:0; transition:opacity 1.2s ease 1.4s; text-shadow:none}
body.love .name{opacity:1}
.big-heart{position:fixed; left:50%; top:50%; width:min(78vmin, 520px); transform:translate(-50%,-50%) scale(.2); opacity:0; pointer-events:none}
.big-heart path{fill:none; stroke:var(--rose); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:420; stroke-dashoffset:420; filter:drop-shadow(0 0 6px rgba(255,61,119,.9))}
body.love .big-heart{animation:hgrow 1.6s cubic-bezier(.2,.9,.3,1) forwards}
body.love .big-heart path{animation:draw 2.4s ease .1s forwards}
@keyframes hgrow{to{opacity:.55; transform:translate(-50%,-50%) scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:.95rem; font-weight:700; color:var(--blush); opacity:0; transition:opacity 1s ease; pointer-events:none}
body.love .hint{opacity:.85; transition-delay:3.2s}
.again{position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:max(14px, env(safe-area-inset-left,0px)); border:1px solid rgba(255,194,214,.5); background:rgba(42,10,30,.35); color:var(--blush); font:inherit; font-weight:700; font-size:.9rem; padding:7px 14px; border-radius:999px; cursor:pointer; opacity:0; transition:opacity 1s ease; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
body.love .again{opacity:1; transition-delay:3.6s}
.again:focus-visible{outline:2px solid var(--white); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){
  #morning .caret{animation:none}
  body.love #forever{animation:pop .01s forwards}
  body.love .big-heart{animation:hgrow .01s forwards}
  body.love .big-heart path{animation:draw .01s forwards}
}
</style>
</head>
<body class="dawn-start">
<div class="sky dawn" aria-hidden="true"></div>
<div class="sky night" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<canvas id="c" aria-hidden="true"></canvas>
<svg class="big-heart" viewBox="0 0 120 110" aria-hidden="true"><path d="M60 100 C22 74 6 54 6 33 C6 17 18 6 33 6 C45 6 55 13 60 24 C65 13 75 6 87 6 C102 6 114 17 114 33 C114 54 98 74 60 100 Z"/></svg>

<main class="stage">
  <h1 class="sr">صباح الخير حبيبي، أحبك للأبد</h1>
  <p class="line" id="morning" aria-hidden="true"></p>
  <p class="line" id="forever" aria-hidden="true">أحبك للأبد<span class="name">يا حمود</span></p>
</main>
<p class="hint" aria-hidden="true">المس الشاشة</p>
<button type="button" class="again" id="again">مرة ثانية</button>

<script>
(function(){
  "use strict";
  var body = document.body, morning = document.getElementById("morning");
  var reduce = false; try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  // ---- hearts ----
  var cv = document.getElementById("c"), ctx = cv.getContext("2d"), W = 0, H = 0, dpr = 1, hearts = [], mode = "dawn";
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener("resize", size);
  var DAWN = ["#ffffff","#ffe3ec","#ffc2d6","#ffd88a"], NIGHT = ["#ff3d77","#ff7aa2","#ffc2d6","#ffd88a","#ff9ec0"];
  function heartPath(s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.32);
    ctx.bezierCurveTo(-s*0.9, -s*0.25, -s*0.45, -s*0.95, 0, -s*0.45);
    ctx.bezierCurveTo(s*0.45, -s*0.95, s*0.9, -s*0.25, 0, s*0.32);
    ctx.closePath();
  }
  function spawnFloat(){
    var cols = mode === "love" ? NIGHT : DAWN;
    hearts.push({x:Math.random()*W, y:H + 30, vx:(Math.random()-.5)*.3, vy:-(0.4 + Math.random()*0.9), s:8 + Math.random()*(mode === "love" ? 22 : 12), a:0, life:1, wob:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], burst:false});
  }
  function burst(x, y, n){
    for(var i = 0; i < n; i++){
      var ang = Math.random()*Math.PI*2, sp = 2 + Math.random()*6;
      hearts.push({x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 2, s:7 + Math.random()*16, a:1, life:1, wob:Math.random()*6, c:NIGHT[i % NIGHT.length], burst:true});
    }
  }
  var acc = 0, last = performance.now();
  function frame(t){
    var dt = Math.min(50, t - last); last = t;
    acc += dt * (mode === "love" ? 0.012 : 0.005);
    while(acc > 1){ spawnFloat(); acc -= 1; }
    ctx.clearRect(0,0,W,H);
    for(var i = hearts.length - 1; i >= 0; i--){
      var h = hearts[i];
      if(h.burst){ h.vy += 0.12; h.vx *= 0.985; h.life -= 0.011; h.a = Math.max(0, h.life); }
      else { h.wob += 0.03; h.x += h.vx + Math.sin(h.wob)*0.4; h.a = Math.min(0.9, h.a + 0.02); if(h.y < H*0.25) h.a *= 0.985; }
      h.x += h.burst ? h.vx : 0; h.y += h.vy;
      if(h.y < -40 || h.life <= 0 || h.a < 0.02 && h.y < H*0.3){ hearts.splice(i,1); continue; }
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.sin(h.wob)*0.25); ctx.globalAlpha = h.a;
      if(mode === "love"){ ctx.shadowColor = h.c; ctx.shadowBlur = 10; }
      ctx.fillStyle = h.c; heartPath(h.s); ctx.fill(); ctx.restore();
    }
    if(hearts.length > 400) hearts.splice(0, hearts.length - 400);
    requestAnimationFrame(frame);
  }
  if(!reduce) requestAnimationFrame(frame);

  addEventListener("pointerdown", function(e){ if(e.target.id === "again") return; if(!reduce) burst(e.clientX, e.clientY, mode === "love" ? 26 : 12); });

  // ---- story ----
  var TEXT = "صباح الخير حبيبي";
  function typeText(done){
    var chars = Array.from(TEXT), i = 0;
    morning.textContent = ""; var span = document.createElement("span"), caret = document.createElement("span");
    caret.className = "caret"; morning.appendChild(span); morning.appendChild(caret);
    if(reduce){ span.textContent = TEXT; later(done, 1500); return; }
    (function step(){
      i++; span.textContent = chars.slice(0, i).join("");
      if(i < chars.length) later(step, chars[i-1] === " " ? 230 : 120 + Math.random()*70);
      else later(function(){ caret.remove(); done(); }, 1400);
    })();
  }
  function play(){
    timers.forEach(clearTimeout); timers = [];
    hearts = []; mode = "dawn";
    body.className = "";
    morning.classList.remove("gone");
    void body.offsetWidth;
    later(function(){ body.classList.add("morning"); }, 60);
    later(function(){
      typeText(function(){
        morning.classList.add("gone");
        later(function(){
          mode = "love"; body.classList.remove("morning"); body.classList.add("love");
          if(!reduce){ burst(W/2, H/2, 70); later(function(){ burst(W*0.25, H*0.35, 30); burst(W*0.75, H*0.4, 30); }, 700); }
        }, 1100);
      });
    }, 700);
  }
  document.getElementById("again").addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
