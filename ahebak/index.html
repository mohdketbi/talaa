<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أحبك</title>
<meta name="description" content="رسالة صغيرة">
<meta property="og:title" content="لك">
<meta property="og:description" content="افتحها">
<meta name="theme-color" content="#ffd6e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z' fill='%23ff3d77'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Cute pastel pink: polka-dot candy background, bubbly sticker text with white outline, bouncing hearts with little faces. Deliberately single-theme. */
:root{
  color-scheme:light;
  --bg1:#ffe4ef; --bg2:#ffc9de; --dot:#fff3f8; --pink:#ff5c9a; --deep:#e0337a; --hot:#ff8fbc; --lilac:#c9a7ff; --peach:#ffb8a3; --white:#ffffff; --ink:#7a1f48;
  --font-cute:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --font-ui:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  direction:rtl; color:var(--ink); font-family:var(--font-ui); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  background-color:var(--bg1);
  background-image:radial-gradient(var(--dot) 18%, transparent 19%), radial-gradient(var(--dot) 18%, transparent 19%), linear-gradient(180deg, var(--bg1), var(--bg2));
  background-size:46px 46px, 46px 46px, 100% 100%;
  background-position:0 0, 23px 23px, 0 0;
}
body.love{animation:bgshift 6s ease-in-out infinite alternate}
@keyframes bgshift{to{background-position:46px 46px, 69px 69px, 0 0}}
.sky,.sun,.big-heart{display:none}
canvas{position:fixed; inset:0; width:100%; height:100%; display:block}
.stage{position:fixed; inset:0; display:grid; place-items:center; padding:calc(24px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); text-align:center; pointer-events:none; z-index:2}
.line{grid-area:1/1; font-family:var(--font-cute); font-weight:800; line-height:1.35; margin:0}
.sticker{color:var(--pink); -webkit-text-stroke:0; paint-order:stroke fill;
  text-shadow:
    0 3px 0 var(--white), 3px 0 0 var(--white), -3px 0 0 var(--white), 0 -3px 0 var(--white),
    2px 2px 0 var(--white), -2px 2px 0 var(--white), 2px -2px 0 var(--white), -2px -2px 0 var(--white),
    0 8px 0 var(--deep), 0 12px 18px rgba(224,51,122,.35)}
#morning{font-size:clamp(2.4rem, 12vw, 4.8rem); max-width:12ch; transition:opacity .6s ease, transform .6s cubic-bezier(.5,-.4,.6,1)}
#morning .caret{display:inline-block; width:.08em; height:.8em; background:var(--pink); border-radius:4px; margin-inline-start:.08em; vertical-align:-.05em; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#morning.gone{opacity:0; transform:scale(.2) rotate(-12deg)}
#forever{width:min(100%, 760px); font-size:clamp(2.4rem, 12.5vw, 5rem); opacity:0}
body.love #forever{opacity:1}
#lv{display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:.1em .45em; min-height:4.8em}
#lv .w{display:inline-block; animation:popin .7s cubic-bezier(.2,1.8,.4,1) both, bob 2.2s ease-in-out .7s infinite}
#lv .w:nth-child(3n+2){color:var(--hot); animation-delay:0s, 1s}
#lv .w:nth-child(3n){color:#b06bff; text-shadow:0 3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 -3px 0 #fff, 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 8px 0 #8a4dd6, 0 12px 18px rgba(138,77,214,.3); animation-delay:0s, .5s}
#lv .w.out{animation:popout .5s ease forwards}
@keyframes popin{0%{opacity:0; transform:scale(0) rotate(-20deg)} 100%{opacity:1; transform:none}}
@keyframes popout{to{opacity:0; transform:scale(.1) rotate(20deg) translateY(-30px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-8px) rotate(2deg)}}
.hint{position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); text-align:center; pointer-events:none; z-index:3; opacity:0; transition:opacity 1s ease}
.hint{font-family:var(--font-cute); font-weight:800; font-size:1rem; color:var(--deep)}
body.love .hint{opacity:.85; transition-delay:3.2s}
.again{position:fixed; z-index:3; top:calc(14px + env(safe-area-inset-top,0px)); left:max(14px, env(safe-area-inset-left,0px)); border:3px solid var(--white); background:var(--pink); color:var(--white); font-family:var(--font-cute); font-weight:800; font-size:.95rem; padding:5px 16px; border-radius:999px; cursor:pointer; opacity:0; transition:opacity 1s ease; box-shadow:0 4px 0 var(--deep)}
body.love .again{opacity:1; transition-delay:3.6s}
.again:active{transform:translateY(3px); box-shadow:0 1px 0 var(--deep)}
.again:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){
  #lv .w, body.love{animation:none}
  #lv .w.out{animation:none; opacity:0}
  #morning .caret{animation:none}
}
</style>
</head>
<body class="dawn-start">
<div class="sky dawn" aria-hidden="true"></div>
<div class="sky night" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<canvas id="c" aria-hidden="true"></canvas>
<svg class="big-heart" viewBox="0 0 120 110" aria-hidden="true"><path d="M60 100 C22 74 6 54 6 33 C6 17 18 6 33 6 C45 6 55 13 60 24 C65 13 75 6 87 6 C102 6 114 17 114 33 C114 54 98 74 60 100 Z"/></svg>

<main class="stage">
  <h1 class="sr">صباح الخير حبيبي، أحبك أحبك أحبك</h1>
  <p class="line sticker" id="morning" aria-hidden="true"></p>
  <div class="line sticker" id="forever" aria-hidden="true"><div id="lv"></div></div>
</main>
<p class="hint" aria-hidden="true">المس الشاشة</p>
<button type="button" class="again" id="again">مرة ثانية</button>

<script>
(function(){
  "use strict";
  var body = document.body, morning = document.getElementById("morning");
  var reduce = false; try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  // ---- hearts ----
  var cv = document.getElementById("c"), ctx = cv.getContext("2d"), W = 0, H = 0, dpr = 1, hearts = [], mode = "dawn";
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener("resize", size);
  var DAWN = ["#ffffff","#ff8fbc","#ffb8a3"], NIGHT = ["#ff5c9a","#ff8fbc","#ffffff","#c9a7ff","#ffb8a3","#ff5c9a"];
  function heartPath(s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.32);
    ctx.bezierCurveTo(-s*0.9, -s*0.25, -s*0.45, -s*0.95, 0, -s*0.45);
    ctx.bezierCurveTo(s*0.45, -s*0.95, s*0.9, -s*0.25, 0, s*0.32);
    ctx.closePath();
  }
  function spawnFloat(){
    var cols = mode === "love" ? NIGHT : DAWN;
    if(mode === "love" && Math.random() < 0.16){
      hearts.push({x:40 + Math.random()*(W-80), y:H + 30, vx:0, vy:-(0.5 + Math.random()*0.7), s:16 + Math.random()*18, a:0, life:1, wob:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], burst:false, word:true});
      return;
    }
    hearts.push({x:Math.random()*W, y:H + 30, vx:(Math.random()-.5)*.3, vy:-(0.4 + Math.random()*0.9), s:10 + Math.random()*(mode === "love" ? 26 : 16), a:0, life:1, wob:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], burst:false});
  }
  function burst(x, y, n){
    for(var i = 0; i < n; i++){
      var ang = Math.random()*Math.PI*2, sp = 2 + Math.random()*6;
      hearts.push({x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 2, s:7 + Math.random()*16, a:1, life:1, wob:Math.random()*6, c:NIGHT[i % NIGHT.length], burst:true});
    }
  }
  var acc = 0, last = performance.now();
  function frame(t){
    var dt = Math.min(50, t - last); last = t;
    acc += dt * (mode === "love" ? 0.009 : 0.005);
    while(acc > 1){ spawnFloat(); acc -= 1; }
    ctx.clearRect(0,0,W,H);
    for(var i = hearts.length - 1; i >= 0; i--){
      var h = hearts[i];
      if(h.burst){ h.vy += 0.12; h.vx *= 0.985; h.life -= 0.011; h.a = Math.max(0, h.life); }
      else { h.wob += 0.03; h.x += h.vx + Math.sin(h.wob)*0.4; h.a = Math.min(h.word ? 0.5 : 0.85, h.a + 0.02); if(h.y < H*0.25) h.a *= 0.985; }
      h.x += h.burst ? h.vx : 0; h.y += h.vy;
      if(h.y < -40 || h.life <= 0 || h.a < 0.02 && h.y < H*0.3){ hearts.splice(i,1); continue; }
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.sin(h.wob)*0.25); ctx.globalAlpha = h.a;
      ctx.fillStyle = h.c; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
      if(h.word){ ctx.font = "800 " + Math.round(h.s) + "px 'Baloo Bhaijaan 2', 'Tajawal', sans-serif"; ctx.textAlign = "center"; ctx.direction = "rtl"; ctx.lineWidth = 4; ctx.strokeText("أحبك", 0, 0); ctx.fillText("أحبك", 0, 0); }
      else {
        heartPath(h.s); if(h.c !== "#ffffff") ctx.stroke(); ctx.fill();
        if(h.s > 15 && !h.burst){
          var e = h.s*0.16, ey = -h.s*0.12;
          ctx.fillStyle = "#7a1f48";
          ctx.beginPath(); ctx.arc(-h.s*0.22, ey, e*0.55, 0, Math.PI*2); ctx.arc(h.s*0.22, ey, e*0.55, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = "#7a1f48"; ctx.lineWidth = Math.max(1.4, h.s*0.06); ctx.lineCap = "round";
          ctx.beginPath(); ctx.arc(0, ey + e*0.6, e*0.7, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
          ctx.fillStyle = "rgba(255,92,154,.55)";
          ctx.beginPath(); ctx.ellipse(-h.s*0.36, ey + e*1.1, e*0.8, e*0.5, 0, 0, Math.PI*2); ctx.ellipse(h.s*0.36, ey + e*1.1, e*0.8, e*0.5, 0, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    }
    if(hearts.length > 400) hearts.splice(0, hearts.length - 400);
    requestAnimationFrame(frame);
  }
  if(!reduce) requestAnimationFrame(frame);

  addEventListener("pointerdown", function(e){ if(e.target.id === "again") return; if(!reduce) burst(e.clientX, e.clientY, mode === "love" ? 26 : 12); });

  // ---- story ----
  var TEXT = "صباح الخير حبيبي";
  function typeText(done){
    var chars = Array.from(TEXT), i = 0;
    morning.textContent = ""; var span = document.createElement("span"), caret = document.createElement("span");
    caret.className = "caret"; morning.appendChild(span); morning.appendChild(caret);
    if(reduce){ span.textContent = TEXT; later(done, 1500); return; }
    (function step(){
      i++; span.textContent = chars.slice(0, i).join("");
      if(i < chars.length) later(step, chars[i-1] === " " ? 230 : 120 + Math.random()*70);
      else later(function(){ caret.remove(); done(); }, 1400);
    })();
  }
  var lv = document.getElementById("lv"), MAXW = 9;
  function loveLoop(){
    var w = document.createElement("span"); w.className = "w"; w.textContent = "أحبك";
    lv.appendChild(w);
    var live = lv.querySelectorAll(".w:not(.out)");
    if(live.length > MAXW){ var old = live[0]; old.classList.add("out"); setTimeout(function(){ old.remove(); }, 600); }
    if(!reduce){ var r = w.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 8); }
    later(loveLoop, reduce ? 1400 : 650);
  }
  function play(){
    timers.forEach(clearTimeout); timers = []; lv.textContent = "";
    hearts = []; mode = "dawn";
    body.className = "";
    morning.classList.remove("gone");
    void body.offsetWidth;
    later(function(){ body.classList.add("morning"); }, 60);
    later(function(){
      typeText(function(){
        morning.classList.add("gone");
        later(function(){
          mode = "love"; body.classList.remove("morning"); body.classList.add("love");
          later(loveLoop, 300);
          if(!reduce){ burst(W/2, H/2, 70); later(function(){ burst(W*0.25, H*0.35, 30); burst(W*0.75, H*0.4, 30); }, 700); }
        }, 1100);
      });
    }, 700);
  }
  document.getElementById("again").addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
